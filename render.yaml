services:
  - type: web
    name: sabihistory-web
    env: php
    plan: free
    region: oregon
    buildCommand: |
      # 1. Install system dependencies required by PHP extensions (like gd and zip)
      apt-get update && apt-get install -y libpng-dev libzip-dev
      docker-php-ext-install gd zip
      # 2. Install Composer dependencies for production
      composer install --no-interaction --no-dev --prefer-dist --no-scripts
      # 3. Generate the application key (important for production)
      php artisan key:generate --force
      # 4. Link the public storage directory
      php artisan storage:link
      # 5. Run database migrations automatically on deploy
      php artisan migrate --force
    startCommand: heroku-php-apache2 public/
    disk:
      - name: sabihistory-storage
        mountPath: /var/www/html/storage
        sizeGB: 1
    envVars:
      - key: APP_URL
        value: https://sabihistory-web.onrender.com
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: SESSION_DRIVER
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: sabihistory-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sabihistory-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sabihistory-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sabihistory-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sabihistory-db
          property: password

databases:
  - name: sabihistory-db
    plan: free
    region: oregon
    postgresMajorVersion: 14
