# Blueprint for deploying the SabiHistory Laravel application on Render.

services:
  # Web Service for the Laravel application
  - type: web
    name: sabihistory-web
    env: php
    # The free plan is a good start. Upgrade as needed.
    plan: free
    # Set your desired region, e.g., 'oregon' (us-west-2) or 'frankfurt' (eu-central-1)
    region: oregon
    # Commands to build your application
    buildCommand: |
      # 1. Install system dependencies required by PHP extensions (like gd and zip)
      apt-get update && apt-get install -y libpng-dev libzip-dev && docker-php-ext-install zip

      # 2. Install Composer dependencies for production
      composer install --no-interaction --no-dev --prefer-dist

      # 3. Generate the application key (important for production)
      php artisan key:generate --force

      # 4. Link the public storage directory
      php artisan storage:link

      # 5. Run database migrations automatically on deploy
      php artisan migrate --force
    # Command to start the web server (Apache + PHP-FPM)
    startCommand: heroku-php-apache2 public/
    # Environment variables for the web service
    envVars:
      - key: APP_URL
        value: https://sabihistory-web.onrender.com # Render generates this URL
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY # The build command generates this, but it's good practice to have it defined.
        generateValue: true # Let Render generate a secure key
      - key: SESSION_ENCRYPT
        value: true
      # Link to the environment group containing database credentials
      - fromGroup: sabihistory-db-credentials

  # Database Service (PostgreSQL in this example)
  - type: pserv
    name: sabihistory-db
    env: postgres
    plan: free
    region: oregon
    # Set the major version of PostgreSQL you want to use
    postgresMajorVersion: 14
    # Define an environment group to store the database credentials.
    # This group can be securely shared with the web service.
    envVarGroups:
      - name: sabihistory-db-credentials
