services:
  - type: web
    name: sabihistory-web
    runtime: docker
    plan: starter # disks require a paid plan; free tier can't attach one
    region: oregon
    dockerfilePath: ./Dockerfile
    disk:
      name: sabihistory-storage
      mountPath: /var/www/html/storage
      sizeGB: 1
    envVars:
      - key: APP_URL
        value: https://sabihistory-web.onrender.com
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: SESSION_DRIVER
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: sabihistory-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sabihistory-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sabihistory-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sabihistory-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sabihistory-db
          property: password

databases:
  - name: sabihistory-db
    plan: free
    region: oregon
    postgresMajorVersion: 14
