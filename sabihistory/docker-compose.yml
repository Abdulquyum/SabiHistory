services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: sabihistory-app
    container_name: sabihistory-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: sqlite
    volumes:
      - ./:/var/www/html
    networks:
      - sabihistory-network

  web:
    image: nginx:alpine
    container_name: sabihistory-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - sabihistory-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: sabihistory-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: sqlite
    volumes:
      - ./:/var/www/html
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["/bin/sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"]
    depends_on:
      - app
    networks:
      - sabihistory-network

networks:
  sabihistory-network:
    driver: bridge