services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: sabihistory-app
    container_name: sabihistory-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    networks:
      - sabihistory-network

  web:
    image: nginx:alpine
    container_name: sabihistory-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - sabihistory-network

  db:
    image: mysql:8.0
    container_name: sabihistory-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sabihistory
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sabihistory-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: sabihistory-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"]
    depends_on:
      - app
    networks:
      - sabihistory-network

networks:
  sabihistory-network:
    driver: bridge

volumes:
  db_data: